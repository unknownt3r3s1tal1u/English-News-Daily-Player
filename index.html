<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English News Daily · Listen</title><style>
:root{--ink:#14243a;--blue:#1769d1;--bg:#f5f8fc;--line:#e2e8f1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}header{background:linear-gradient(125deg,#0b2a4a,#1769d1);color:#fff;padding:3rem max(1.2rem,calc((100vw - 1040px)/2))}h1{margin:0;font-size:clamp(2rem,5vw,3.2rem);line-height:1.1}header p{max-width:680px;opacity:.88}main{max-width:1040px;margin:auto;padding:2rem 1.2rem 4rem}.bar{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.2rem}button{border:1px solid #c8d5e5;background:#fff;color:#0b2a4a;font:inherit;font-weight:700;padding:.55rem .8rem;border-radius:.55rem;cursor:pointer}button:hover{border-color:var(--blue);color:var(--blue)}.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.card{background:#fff;border:1px solid var(--line);border-radius:1rem;padding:1.25rem;margin:1rem 0;box-shadow:0 3px 14px #12243a0a}.card h2{margin:0 0 .8rem;font-size:1.25rem;line-height:1.35}.label{margin-top:1rem;color:var(--blue);font-size:.76rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.line{display:flex;gap:.75rem;align-items:flex-start;border-top:1px solid #edf1f6;padding:.6rem 0}.line p{margin:0}.play{padding:.32rem .55rem;white-space:nowrap}.note{color:#65768b;font-size:.9rem}.date{background:#e8f0fe;border-color:var(--blue)}@media(max-width:580px){header{padding:2.3rem 1.2rem}.card{padding:1rem}}
</style></head><body><header><h1>English News Daily</h1><p>Click any button to hear natural American English. Full-briefing playback keeps sentences together for connected speech and shadowing practice.</p></header><main><div class="bar"><div id="dates"></div><div><button id="all" class="primary">▶ Play full briefing</button> <button id="stop">■ Stop</button></div></div><p class="note">Voice: American English (en-US). The exact voice is provided by your device’s browser.</p><div id="content"></div></main><script>
let queue=[],pos=0,playing=false;const say=t=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.92;speechSynthesis.speak(u)};const el=(tag,cls,txt)=>{const x=document.createElement(tag);if(cls)x.className=cls;if(txt)x.textContent=txt;return x};function row(t){const x=el('div','line'),b=el('button','play','▶ Play'),p=el('p','',t);b.onclick=()=>say(t);x.append(b,p);return x}function group(title,lines){const w=document.createElement('div');w.append(el('div','label',title));lines.forEach(t=>w.append(row(t)));return w}function render(d){const root=document.querySelector('#content');root.innerHTML='';queue=[];d.items.forEach((s,i)=>{const c=el('article','card'),h=el('h2','',(i+1)+'. '+s.title);c.append(h,group('Summary',s.summary),group('Why it matters',[s.why]),group('Language points',s.language.flatMap(x=>[x.term,x.example])));root.append(c);queue.push(s.title,...s.summary,s.why,...s.language.flatMap(x=>[x.term,x.example]))});const c=el('article','card');c.append(el('h2','','Further language notes'),group('More to practise',d.further.flatMap(x=>[x.term,x.example])));root.append(c);queue.push(...d.further.flatMap(x=>[x.term,x.example]))}function next(){if(!playing||pos>=queue.length){playing=false;return}const u=new SpeechSynthesisUtterance(queue[pos++]);u.lang='en-US';u.rate=.92;u.onend=next;speechSynthesis.speak(u)}document.querySelector('#all').onclick=()=>{speechSynthesis.cancel();pos=0;playing=true;next()};document.querySelector('#stop').onclick=()=>{playing=false;speechSynthesis.cancel()};fetch('data/index.json').then(r=>r.json()).then(x=>{x.dates.forEach((d,i)=>{const b=el('button',i?'':'date',d);b.onclick=()=>fetch('data/'+d+'.json').then(r=>r.json()).then(render);document.querySelector('#dates').append(b)});return fetch('data/'+x.dates[0]+'.json')}).then(r=>r.json()).then(render);
</script></body></html>
